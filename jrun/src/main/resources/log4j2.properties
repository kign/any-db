# Third-party libraries (JDBC drivers, AWS SDK) only report warnings and errors
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = CONSOLE

logger.anydb.name = net.inet_lab.any_db
logger.anydb.level = DEBUG

logger.tabular.name = net.inet_lab.any_db.utils.TabularOutput
logger.tabular.level = INFO

logger.jcol.name = net.inet_lab.any_db.jcol.JCol
logger.jcol.level = INFO

appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ABSOLUTE} %-5p %c - %m%n
