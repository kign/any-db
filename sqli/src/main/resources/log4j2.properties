# All logging goes to ~/sqli3.log so it doesn't interfere with the interactive shell.
# Third-party libraries (JDBC drivers, AWS SDK) only report warnings and errors.
rootLogger.level = WARN
rootLogger.appenderRef.file.ref = FILE

logger.anydb.name = net.inet_lab.any_db
logger.anydb.level = DEBUG

logger.tabular.name = net.inet_lab.any_db.utils.TabularOutput
logger.tabular.level = INFO

appender.file.type = File
appender.file.name = FILE
appender.file.fileName = ${sys:user.home}/sqli3.log
appender.file.append = true
appender.file.immediateFlush = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{ABSOLUTE} %-5p %c - %m%n
